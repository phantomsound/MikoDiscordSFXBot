<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miko SFX - Admin</title>
    <style>
        :root { --bg: #1e1e2e; --card: #282a36; --card-alt: #313244; --input: #181825; --border: #45475a; --text: #cdd6f4; --blue: #89b4fa; --green: #a6e3a1; --red: #f38ba8; --yellow: #f9e2af; }
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); color: var(--text); padding: 1.5rem; max-width: 1100px; margin: 0 auto; line-height: 1.4; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: 1rem; }
        .tab-nav { display: flex; gap: 10px; margin-bottom: 1.5rem; border-bottom: 2px solid var(--border); padding-bottom: 10px; }
        .tab-btn { background: transparent; color: var(--text); border: none; padding: 0.6rem 1.2rem; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 1.05rem; opacity: 0.6; transition: 0.2s; }
        .tab-btn:hover { opacity: 1; background: var(--card); }
        .tab-btn.active { opacity: 1; background: var(--yellow); color: #11111b; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .card { background: var(--card); padding: 1.3rem; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 1.5rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1rem; }
        .tile { background: var(--input); padding: 1rem; border-radius: 6px; border: 1px solid var(--border); text-align: center; }
        input, select { padding: 0.6rem; background: var(--input); border: 1px solid var(--border); color: var(--text); border-radius: 6px; width: 100%; font-size: 0.92rem; }
        button { background: var(--blue); color: #11111b; padding: 0.6rem 1rem; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.88rem; display: inline-flex; align-items: center; justify-content: center; gap: 0.3rem; }
        button:hover { filter: brightness(1.15); }
        .btn-success { background: var(--green); } .btn-danger { background: var(--red); color: #11111b; } .btn-secondary { background: var(--card-alt); color: var(--text); border: 1px solid var(--border); }
        .btn-warning { background: var(--yellow); }
        .status-dot { height: 10px; width: 10px; background-color: var(--red); border-radius: 50%; display: inline-block; margin-right: 6px; }
        .status-dot.active { background-color: var(--green); }
        .terminal-box { background: #11111b; border: 1px solid var(--border); border-radius: 6px; padding: 0.8rem; font-family: 'Consolas', monospace; font-size: 0.82rem; height: 230px; overflow-y: auto; white-space: pre-wrap; color: #a6e3a1; margin-top: 0.6rem; }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <h1 style="margin:0 0 4px 0;">🎙️ Miko SFX Dashboard</h1>
            <div style="display: flex; align-items: center; gap: 12px;">
                <span style="color: var(--green); font-size: 0.88rem; font-weight: bold;">🖥️ Host: <span id="hostBadge">MIKOHOME</span></span>
                <span style="font-size: 0.85rem; color: #a6adc8;">| Active Guild:</span>
                <select id="guildSelector" onchange="switchGuildContext()" style="width: auto; padding: 2px 8px; font-size: 0.85rem;"></select>
            </div>
        </div>
        <div style="display: flex; gap: 8px;">
            <button class="btn-secondary" onclick="window.open('http://localhost:3000', '_blank')">🎧 Miko Music</button>
            <button class="btn-success" onclick="inviteBot()">➕ Invite SFX Bot</button>
        </div>
    </div>

    <div class="tab-nav">
        <button class="tab-btn active" onclick="switchTab('soundboard')">🎛️ Soundboard Tiles</button>
        <button class="tab-btn" onclick="switchTab('tools')">⚙️ Controls & Logs</button>
    </div>

    <!-- TAB: SOUNDBOARD -->
    <div id="tab-soundboard" class="tab-content active">
        <div class="card" style="border-left: 4px solid var(--yellow); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
            <div style="display: flex; gap: 10px; align-items: center;">
                <select id="voiceChannelSelect" style="max-width: 280px;"><option value="">-- Voice Channel --</option></select>
                <button onclick="manageVoice('join')" class="btn-success">🔊 Join Channel</button>
                <button onclick="manageVoice('disconnect')" class="btn-danger">🔇 Disconnect</button>
            </div>
            <div style="display: flex; align-items: center; gap: 10px; background: var(--input); padding: 0.4rem 0.9rem; border-radius: 20px; border: 1px solid var(--border);">
                <span>SFX Vol: <b id="volLabel">100</b>%</span>
                <button id="muteToggleBtn" onclick="toggleMute()" style="padding:0; background:transparent; font-size:1.1rem;">🔊</button>
                <input type="range" id="volSlider" min="0" max="200" value="100" onchange="setVolume()" style="width: 120px; cursor: pointer;">
                <button onclick="stopAudio()" class="btn-danger" style="padding: 0.3rem 0.6rem; font-size: 0.8rem;">⏹️ Stop SFX</button>
            </div>
        </div>

        <div class="grid" id="sfxGrid">Loading Soundboard Tiles...</div>
    </div>

    <!-- TAB: TOOLS & LOGS -->
    <div id="tab-tools" class="tab-content">
        <div class="card" style="border-left: 4px solid var(--green);">
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.8rem;">
                <div>
                    <h3 style="margin: 0;">🖥️ Diagnostics & Process Management</h3>
                    <span style="font-size:0.82rem; color:#a6adc8;">Host Time: <b id="systemTimeLabel">--</b></span>
                </div>
                <div style="display: flex; gap: 8px;">
                    <button onclick="window.open('/api/logs/export')" class="btn-secondary">📥 Export (.txt)</button>
                    <button onclick="fetchLogs()" class="btn-secondary">🔄 Refresh</button>
                    <button onclick="restartService()" class="btn-danger">⚠️ Restart SFX Service</button>
                </div>
            </div>
            <div class="terminal-box" id="terminalBox">Loading service logs...</div>
        </div>
    </div>

    <script>
        let isMuted = false, preMuteVol = 100, storedClientId = '';

        function getActiveGuildId() { return document.getElementById('guildSelector').value; }
        function switchTab(id) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelector(`.tab-btn[onclick="switchTab('${id}')"]`).classList.add('active');
            document.getElementById(`tab-${id}`).classList.add('active');
        }

        function switchGuildContext() { loadChannels(); }

        function loadConfig() {
            fetch('/api/server-info').then(r => r.json()).then(data => {
                document.getElementById('hostBadge').innerText = data.hostName;
                document.getElementById('systemTimeLabel').innerText = data.systemTime;
                const gSelect = document.getElementById('guildSelector');
                gSelect.innerHTML = '';
                (data.guilds || []).forEach(g => { gSelect.innerHTML += `<option value="${g.id}">${g.name}</option>`; });
                loadChannels();
            });

            fetch('/api/config').then(r => r.json()).then(data => {
                storedClientId = data.clientId || '';
                const sounds = (data.config && data.config.sounds) ? data.config.sounds : [];
                renderGrid(sounds);
            }).catch(() => {
                renderGrid(Array.from({ length: 12 }, (_, i) => ({ id: i + 1, name: `Slot ${i + 1}`, file: null })));
            });

            fetchLogs();
        }

        function loadChannels() {
            const guildId = getActiveGuildId();
            fetch(`/api/voice-channels?guildId=${guildId}`).then(r => r.json()).then(channels => {
                const vcSelect = document.getElementById('voiceChannelSelect');
                vcSelect.innerHTML = '<option value="">-- Voice Channel --</option>';
                channels.forEach(c => vcSelect.innerHTML += `<option value="${c.id}">${c.name}</option>`);
            });
        }

        function renderGrid(sounds) {
            const grid = document.getElementById('sfxGrid');
            grid.innerHTML = '';
            for (let i = 1; i <= 12; i++) {
                const s = sounds.find(item => item.id === i) || { id: i, name: `Slot ${i}`, file: null };
                const hasAudio = Boolean(s.file);
                const dotClass = hasAudio ? 'status-dot active' : 'status-dot';
                grid.innerHTML += `
                    <div class="tile">
                        <div style="margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; font-weight: bold; font-size: 0.9rem;">
                            <span><span class="${dotClass}"></span> Slot ${s.id}</span>
                            <span style="font-size:0.75rem; color:${hasAudio ? 'var(--green)' : '#6c7086'};">${hasAudio ? 'Ready' : 'Empty'}</span>
                        </div>
                        <input type="text" id="name_${s.id}" value="${s.name || `Slot ${s.id}`}" placeholder="Tile Label" style="margin-bottom: 6px;">
                        <input type="file" id="file_${s.id}" accept=".mp3,.wav,.ogg" style="font-size: 0.75rem; margin-bottom: 8px;">
                        <div style="display: flex; gap: 6px;">
                            <button class="btn-success" style="flex: 1;" onclick="uploadAudio(${s.id})">💾 Save</button>
                            <button class="btn-warning" style="flex: 1;" onclick="playAudio(${s.id})" ${!hasAudio ? 'disabled style="opacity:0.4;"' : ''}>▶️ Play</button>
                        </div>
                    </div>
                `;
            }
        }

        function uploadAudio(id) {
            const fileInput = document.getElementById(`file_${id}`);
            const nameInput = document.getElementById(`name_${id}`).value;
            const formData = new FormData();
            formData.append('slotId', id);
            formData.append('name', nameInput);
            if (fileInput.files[0]) formData.append('audio', fileInput.files[0]);

            fetch('/api/upload', { method: 'POST', body: formData })
                .then(r => r.json())
                .then(res => { if (res.success) { alert(`Slot ${id} updated!`); loadConfig(); } });
        }

        function playAudio(id) {
            fetch('/api/play', { 
                method: 'POST', 
                headers: {'Content-Type': 'application/json'}, 
                body: JSON.stringify({ slotId: id, guildId: getActiveGuildId() }) 
            }).then(r => r.json()).then(res => { if (!res.success) alert(res.message); else fetchLogs(); });
        }

        function stopAudio() {
            fetch('/api/control', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ action: 'stop', guildId: getActiveGuildId() }) });
        }

        function manageVoice(action) {
            const channelId = document.getElementById('voiceChannelSelect').value;
            fetch('/api/voice', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ action, channelId, guildId: getActiveGuildId() }) })
            .then(r => r.json()).then(res => { if(!res.success) alert(res.message); });
        }

        function toggleMute() {
            const slider = document.getElementById('volSlider');
            if (isMuted) {
                isMuted = false;
                slider.value = preMuteVol;
                document.getElementById('muteToggleBtn').innerText = '🔊';
            } else {
                isMuted = true;
                preMuteVol = slider.value == 0 ? 100 : slider.value;
                slider.value = 0;
                document.getElementById('muteToggleBtn').innerText = '🔇';
            }
            setVolume();
        }

        function setVolume() {
            const vol = document.getElementById('volSlider').value;
            document.getElementById('volLabel').innerText = vol;
            fetch('/api/volume', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ volume: vol, guildId: getActiveGuildId() }) });
        }

        function fetchLogs() {
            fetch('/api/logs').then(r => r.json()).then(data => {
                const b = document.getElementById('terminalBox');
                b.innerText = data.logs || "No logs recorded yet.";
                b.scrollTop = b.scrollHeight;
            });
        }

        function restartService() {
            if (confirm("Restart the Miko SFX service now?")) {
                fetch('/api/system/restart', { method: 'POST' }).then(() => alert('Restart signal sent.'));
            }
        }

        function inviteBot() {
            const id = storedClientId || prompt("Paste your SFX Application Client ID:");
            if (id) {
                const a = document.createElement('a');
                a.href = `https://discord.com/oauth2/authorize?client_id=${id}&permissions=3148800&scope=bot%20applications.commands`;
                a.target = '_blank';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            }
        }

        setInterval(fetchLogs, 5000);
        loadConfig();
    </script>
</body>
</html>
